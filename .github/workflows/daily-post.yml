name: Daily Twitter Post

on:
  schedule:
    # Red de seguridad: si por algún motivo la cadena de auto-disparo se
    # corta (ver el último step del job), esto la reinicia como máximo
    # cada 6 horas. En condiciones normales, el propio job se re-dispara
    # solo apenas termina, sin esperar a este cron.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install tweepy google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Revisión periódica cada 15 min
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
          TW_API_SECRET: ${{ secrets.TW_API_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TW_ACCESS_TOKEN }}
          TW_ACCESS_TOKEN_SECRET: ${{ secrets.TW_ACCESS_TOKEN_SECRET }}
          TWEET_TEXT_TEMPLATE: ""
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          TIKTOK_PRIVACY_LEVEL: "PUBLIC_TO_EVERYONE"
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # El script decide él solo, cada 15 min, si le toca publicar en
          # cada red (según platform_config.json). 20 revisiones = ~5h
          # cubiertas, dejando margen antes del límite de 6h de GitHub Actions.
          for i in $(seq 1 20); do
            echo "=== Revisión $i de 20 ==="

            # Sincroniza con el remoto ANTES de decidir qué publicar,
            # para partir siempre del registro más actualizado y reducir
            # el riesgo de conflicto al guardar después.
            git pull --rebase origin main || {
              echo "pull --rebase falló, se aborta y se sincroniza a la fuerza"
              git rebase --abort 2>/dev/null || true
              git checkout main 2>/dev/null || true
              git reset --hard origin/main
            }

            python post_daily.py || echo "Esta revisión falló, se continúa con la siguiente"

            git add posted_log.json rotation_state.json twitter_log.json youtube_log.json tiktok_log.json instagram_log.json hit_log.json 2>/dev/null || git add posted_log.json
            git diff --staged --quiet || git commit -m "Actualiza registros ($i)"

            if ! git push; then
              echo "push falló, se reintenta una vez tras resincronizar"
              git pull --rebase origin main || {
                git rebase --abort 2>/dev/null || true
                git checkout main 2>/dev/null || true
                git reset --hard origin/main
              }
              git push || echo "push volvió a fallar, se reintentará en la próxima revisión"
            fi

            if [ "$i" -lt 20 ]; then
              echo "Esperando 15 minutos..."
              sleep 900
            fi
          done

      - name: Encadenar la siguiente ejecución (sin esperar al cron)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-post.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Siguiente ejecución disparada."