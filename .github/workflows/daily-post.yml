name: Daily Twitter Post

on:
  schedule:
    # Red de seguridad: si por algún motivo la cadena de auto-disparo se
    # corta (ver el último step del job), esto la reinicia como máximo
    # cada 6 horas. En condiciones normales, el propio job se re-dispara
    # solo apenas termina, sin esperar a este cron.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install tweepy

      - name: Bucle de publicaciones cada 30 min
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
          TW_API_SECRET: ${{ secrets.TW_API_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TW_ACCESS_TOKEN }}
          TW_ACCESS_TOKEN_SECRET: ${{ secrets.TW_ACCESS_TOKEN_SECRET }}
          TWEET_TEXT_TEMPLATE: ""
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 11 publicaciones separadas por 30 min = ~5.5 horas cubiertas,
          # dejando margen antes de que este job se reinicie cada 6 horas.
          for i in $(seq 1 11); do
            echo "=== Publicación $i de 11 ==="
            python post_daily.py || echo "Esta publicación falló, se continúa con la siguiente"

            git add posted_log.json
            git diff --staged --quiet || git commit -m "Actualiza registro de publicados ($i)"
            git pull --rebase origin main || echo "pull --rebase falló, se intenta push igual"
            git push || echo "push falló, se reintentará en la próxima publicación"

            if [ "$i" -lt 11 ]; then
              echo "Esperando 30 minutos..."
              sleep 1800
            fi
          done

      - name: Encadenar la siguiente ejecución (sin esperar al cron)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-post.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Siguiente ejecución disparada."
